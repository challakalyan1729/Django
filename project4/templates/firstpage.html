<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GET Method Example</title>
</head>
<body>
    <h1>Simple GET Form</h1>
    
    <!-- Form with GET method -->
    <form method="GET" action="/hello/">
        <label>Enter your name:</label>
        <input type="text" name="name">
        <button type="submit">Submit</button>
    </form>
    
</body>
</html>
